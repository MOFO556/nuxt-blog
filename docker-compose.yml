# Profiles:
#   seed      — copy local .data/db/stash.db into the named volume
#   litestream — replicate volume DB to R2
#   wipe      — delete DB inside the volume (to practice restore)
#   restore   — restore DB from R2 into the volume
#   app       — build & run Nuxt + Litestream

services:
  seed-db:
    image: alpine:3.20
    volumes:
      - dbdata:/data
      - ./.data/db:/seed:ro
    command:
      - sh
      - -c
      - |
        set -eu
        mkdir -p /data/db
        cp -f /seed/stash.db /data/db/stash.db
        rm -f /data/db/stash.db-wal /data/db/stash.db-shm
        ls -lah /data/db
    profiles: ["seed"]

  wipe-db:
    image: alpine:3.20
    volumes:
      - dbdata:/data
    command:
      - sh
      - -c
      - |
        set -eu
        rm -f /data/db/stash.db /data/db/stash.db-wal /data/db/stash.db-shm
        echo "wiped /data/db"
        ls -lah /data/db || true
    profiles: ["wipe"]

  litestream:
    image: litestream/litestream:0.5.14
    volumes:
      - dbdata:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    environment:
      NUXT_DB_FILE: /data/db/stash.db
      LITESTREAM_BUCKET: ${LITESTREAM_BUCKET}
      LITESTREAM_ENDPOINT: ${LITESTREAM_ENDPOINT}
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY}
    command: ["replicate", "-config", "/etc/litestream.yml"]
    profiles: ["litestream"]

  restore-db:
    image: litestream/litestream:0.5.14
    volumes:
      - dbdata:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    environment:
      NUXT_DB_FILE: /data/db/stash.db
      LITESTREAM_BUCKET: ${LITESTREAM_BUCKET}
      LITESTREAM_ENDPOINT: ${LITESTREAM_ENDPOINT}
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY}
    command:
      - restore
      - -if-db-not-exists
      - -if-replica-exists
      - -config
      - /etc/litestream.yml
      - /data/db/stash.db
    profiles: ["restore"]

  app:
    build:
      context: .
      args:
        S3_BUCKET: ${S3_BUCKET:-${LITESTREAM_BUCKET}}
        S3_ENDPOINT: ${S3_ENDPOINT:-${LITESTREAM_ENDPOINT}}
        S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-${LITESTREAM_ACCESS_KEY_ID}}
        S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-${LITESTREAM_SECRET_ACCESS_KEY}}
        S3_REGION: ${S3_REGION:-auto}
    ports:
      - "3000:3000"
    volumes:
      - dbdata:/data
    env_file:
      - .env
    environment:
      NUXT_DB_FILE: /data/db/stash.db
      HOST: 0.0.0.0
      PORT: "3000"
      LITESTREAM_BUCKET: ${LITESTREAM_BUCKET}
      LITESTREAM_ENDPOINT: ${LITESTREAM_ENDPOINT}
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-${LITESTREAM_BUCKET}}
      S3_ENDPOINT: ${S3_ENDPOINT:-${LITESTREAM_ENDPOINT}}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-${LITESTREAM_ACCESS_KEY_ID}}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-${LITESTREAM_SECRET_ACCESS_KEY}}
      S3_REGION: ${S3_REGION:-auto}
    profiles: ["app"]

volumes:
  dbdata:
